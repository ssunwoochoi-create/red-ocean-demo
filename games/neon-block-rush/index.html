<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="네온 블록 러시 — 8×8 보드에 네온 블록을 끌어다 채우고 줄을 터뜨리는 아케이드 퍼즐">
<title>NEON BLOCK RUSH · 네온 블록 러시</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a18'/%3E%3Crect x='8' y='8' width='20' height='20' rx='5' fill='%233ae7ff'/%3E%3Crect x='36' y='8' width='20' height='20' rx='5' fill='%23ff4da6'/%3E%3Crect x='8' y='36' width='20' height='20' rx='5' fill='%23a97bff'/%3E%3Crect x='36' y='36' width='20' height='20' rx='5' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
  :root{
    --cyan:#3ae7ff; --pink:#ff4da6; --violet:#a97bff; --gold:#ffd166;
    --ink:#eaf3ff; --dim:#7f97c9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; background:#04060f;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 50% -15%, rgba(74,72,214,.40), transparent 62%),
      radial-gradient(620px 480px at 6% 108%, rgba(255,60,160,.20), transparent 60%),
      radial-gradient(620px 480px at 96% 104%, rgba(0,214,255,.18), transparent 60%),
      #04060f;
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  body::before{
    content:""; position:fixed; inset:-1px; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(90,140,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,140,255,.055) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(closest-side at 50% 38%, #000 35%, transparent 100%);
    mask-image:radial-gradient(closest-side at 50% 38%, #000 35%, transparent 100%);
  }
  #app{
    position:relative; z-index:1;
    height:100vh; height:100dvh; width:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 2px 0;}
  h1{
    margin:0; font-size:15px; font-weight:900; letter-spacing:.155em; line-height:1; white-space:nowrap;
    background:linear-gradient(92deg,#4ff0ff 0%,#8b7cff 46%,#ff5ec4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 9px rgba(90,200,255,.5));
  }
  .hbtns{display:flex; gap:6px;}
  .ico{
    width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
    border:1px solid rgba(120,170,255,.26); background:rgba(255,255,255,.05);
    color:#cfe2ff; font-family:inherit; cursor:pointer; padding:0;
    transition:transform .08s, background .15s, border-color .15s, opacity .15s;
  }
  .ico:active{transform:scale(.93);}
  .ico svg{width:18px; height:18px; display:block;}
  .ico .ic-off{display:none;}
  .ico.off{opacity:.72; color:#8ea4cc;}
  .ico.off .ic-on{display:none;}
  .ico.off .ic-off{display:block;}
  .ico.armed{border-color:var(--gold); color:var(--gold); box-shadow:0 0 14px rgba(255,190,80,.5); opacity:1;}

  .hud{display:flex; align-items:flex-end; gap:12px; padding:2px 2px 0;}
  .stat{display:flex; flex-direction:column; line-height:1;}
  .stat .k{font-size:9px; letter-spacing:.2em; color:var(--dim); margin-bottom:4px;}
  .stat .v{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-weight:800; font-size:27px; letter-spacing:.01em;
    text-shadow:0 0 16px rgba(80,200,255,.55);
    font-variant-numeric:tabular-nums;
  }
  .stat.best .v{font-size:14px; color:#a6d8ff; opacity:.9; text-shadow:none;}
  .combo{
    margin-left:auto; font-weight:900; font-size:13px; letter-spacing:.04em; color:var(--gold);
    text-shadow:0 0 14px rgba(255,200,80,.85);
    opacity:0; transform:translateY(5px) scale(.9); transition:opacity .16s, transform .16s;
    padding-bottom:3px; white-space:nowrap;
  }
  .combo.on{opacity:1; transform:none;}
  .combo.pop{animation:pop .35s ease-out;}
  @keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}

  .fever{display:flex; align-items:center; gap:9px; padding:0 2px;}
  .fever .bar{
    position:relative; flex:1; height:7px; border-radius:99px;
    background:rgba(255,255,255,.07); overflow:hidden;
    box-shadow:inset 0 0 6px rgba(0,0,0,.6);
  }
  .fever .bar i{
    position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#00e0ff,#7a6bff 52%,#ff4da6);
    box-shadow:0 0 12px rgba(120,120,255,.85);
    transition:width .2s ease, box-shadow .2s;
  }
  .fever span{font-size:9px; letter-spacing:.2em; color:var(--dim); white-space:nowrap;}
  .fever.hot span{color:#ff7ac1; text-shadow:0 0 12px rgba(255,80,180,.9);}
  .fever.hot .bar i{box-shadow:0 0 18px rgba(255,90,190,1);}

  .hint{
    margin:0; text-align:center; font-size:11.5px; color:#8fa6cf; letter-spacing:.01em;
    height:15px; line-height:15px; transition:color .2s;
  }
  .hint.warn{color:#ffb35c; text-shadow:0 0 12px rgba(255,150,60,.6); font-weight:700;}

  .stage{position:relative; flex:1 1 auto; min-height:0;}
  canvas{position:absolute; top:0; left:0; display:block; touch-action:none; border-radius:16px;}

  .actions{display:flex; gap:8px; margin-top:1px;}
  .act{
    flex:1; height:46px; display:flex; align-items:center; justify-content:center; gap:7px;
    border-radius:14px; border:1px solid rgba(120,170,255,.24);
    background:linear-gradient(180deg, rgba(42,57,112,.62), rgba(12,18,40,.88));
    color:#dbe9ff; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 6px 16px rgba(0,0,0,.35);
    transition:transform .08s, border-color .15s, box-shadow .15s, opacity .15s;
  }
  .act .e{display:grid; place-items:center;}
  .act .e svg{width:19px; height:19px; display:block;}
  .act b{
    font-family:ui-monospace,monospace; font-size:11px; font-weight:800;
    padding:2px 6px; border-radius:8px; background:rgba(120,180,255,.18); color:#bfe4ff;
  }
  .act:active{transform:scale(.975);}
  .act:disabled{opacity:.34; filter:grayscale(.6); cursor:default;}
  .act.on{border-color:var(--gold); box-shadow:0 0 20px rgba(255,180,80,.55), inset 0 0 14px rgba(255,180,80,.22);}
  .act.pulse{animation:pulseBtn 1s ease-in-out infinite;}
  @keyframes pulseBtn{0%,100%{box-shadow:0 0 0 rgba(255,140,60,0)}50%{box-shadow:0 0 22px rgba(255,140,60,.75)}}

  .over{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:22px;
    background:rgba(3,5,14,.72); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    animation:fadeIn .25s ease-out;
  }
  .over[hidden]{display:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{
    width:100%; max-width:322px; border-radius:22px; padding:22px 20px 20px; text-align:center;
    background:linear-gradient(180deg, rgba(26,32,62,.97), rgba(9,13,29,.99));
    border:1px solid rgba(120,170,255,.3);
    box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 46px rgba(90,120,255,.28);
    animation:rise .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes rise{from{transform:translateY(18px) scale(.95); opacity:0}to{transform:none; opacity:1}}
  .kicker{font-size:10px; letter-spacing:.32em; color:#8fa6cf; margin-bottom:6px;}
  .kicker.gold{color:var(--gold); text-shadow:0 0 14px rgba(255,200,80,.8);}
  .final{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:900; font-size:44px; line-height:1.1;
    background:linear-gradient(92deg,#5ef0ff,#a68cff 50%,#ff5ec4);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(110,160,255,.55));
    font-variant-numeric:tabular-nums;
  }
  .row2{display:flex; gap:10px; margin:16px 0 18px;}
  .row2 > div{
    flex:1; padding:10px 6px; border-radius:13px; background:rgba(255,255,255,.045);
    border:1px solid rgba(120,170,255,.16);
    display:flex; flex-direction:column; gap:5px;
  }
  .row2 b{font-family:ui-monospace,monospace; font-size:17px; font-weight:800; color:#d8ecff;}
  .row2 span{font-size:9px; letter-spacing:.18em; color:var(--dim);}
  .again{
    width:100%; height:50px; border:0; border-radius:15px; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:900; letter-spacing:.02em; color:#04121a;
    background:linear-gradient(92deg,#4ff0ff,#8b7cff 55%,#ff6ec7);
    box-shadow:0 12px 30px rgba(90,140,255,.4);
    transition:transform .08s, filter .15s;
  }
  .again:active{transform:scale(.98); filter:brightness(1.08);}
  .sub{margin:12px 0 0; font-size:10.5px; color:#6f86b3; letter-spacing:.02em;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>NEON BLOCK RUSH</h1>
    <div class="hbtns">
      <button id="btnSound" class="ico" aria-label="소리 끄기" aria-pressed="false" title="소리">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.6L13 18.5v-13L7.6 9.5H4z" fill="currentColor" stroke="none"/><path d="M16.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M19.2 6a8.6 8.6 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.6L13 18.5v-13L7.6 9.5H4z" fill="currentColor" stroke="none"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
      </button>
      <button id="btnRestart" class="ico" aria-label="새 게임" title="새 게임">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.8 4.2v4.2h-4.2"/></svg>
      </button>
    </div>
  </header>

  <div class="hud">
    <div class="stat"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
    <div class="stat best"><span class="k">BEST</span><span class="v" id="best">0</span></div>
    <div class="combo" id="combo"></div>
  </div>

  <div class="fever" id="fever">
    <div class="bar"><i id="feverFill"></i></div>
    <span id="feverTxt">FEVER</span>
  </div>

  <p class="hint" id="hint">블록을 끌어 가로·세로 줄을 채워 터뜨리세요!</p>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="actions">
    <button id="btnReroll" class="act" aria-label="조각 새로고침">
      <span class="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a7.8 7.8 0 0 1 13.2-5.6"/><path d="M17.8 3.4v4h-4"/><path d="M19.8 12a7.8 7.8 0 0 1-13.2 5.6"/><path d="M6.2 20.6v-4h4"/></svg></span>
      <span>리롤</span><b id="rerollN">2</b></button>
    <button id="btnBomb" class="act" aria-label="3x3 폭탄">
      <span class="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="14" r="5.8"/><path d="M14.6 9.2l1.9-1.9"/><path d="M18.6 3.2l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7z" fill="currentColor" stroke="none"/></svg></span>
      <span>폭탄</span><b id="bombN">1</b></button>
  </div>
</div>

<div id="over" class="over" hidden>
  <div class="card">
    <div class="kicker" id="overKicker">GAME OVER</div>
    <div class="final" id="finalScore">0</div>
    <div class="row2">
      <div><b id="ovBest">0</b><span>BEST</span></div>
      <div><b id="ovCombo">0</b><span>MAX COMBO</span></div>
    </div>
    <button id="btnAgain" class="again">다시 도전</button>
    <p class="sub" id="ovSub">한 판 더, 각이 나옵니다.</p>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   NEON BLOCK RUSH — single-file arcade puzzle
   ========================================================= */

const $ = (s) => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const rnd = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));

const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------------- canvas & layout ---------------- */
const cv = $('#cv');
const ctx = cv.getContext('2d');
const stage = document.querySelector('.stage');

const N = 8;                      // board is 8x8
let W=0, H=0, DPR=1;
let cell=40, boardX=0, boardY=0, boardW=0, trayTop=0, trayH=0, trayCell=30;
const slots = [{x:0,y:0},{x:0,y:0},{x:0,y:0}];
let TOUCH_LIFT = 58;

function layout(){
  const r = stage.getBoundingClientRect();
  W = Math.max(240, Math.floor(r.width));
  H = Math.max(300, Math.floor(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 3);

  const padX = 8, padY = 8;
  const rowsF = N + 0.34 + 3.0;                      // board + gap + tray, in cell units
  const byW = (W - padX*2) / N;
  const byH = (H - padY*2) / rowsF;
  cell = Math.floor(Math.min(byW, byH) * 2) / 2;

  boardW = cell * N;
  boardX = (W - boardW) / 2;
  trayH   = cell * 3.0;
  const gap = cell * 0.34;
  const totalH = boardW + gap + trayH;
  boardY = padY + Math.max(0, (H - padY*2 - totalH) / 2);
  trayTop = boardY + boardW + gap;
  trayCell = cell * 0.76;
  TOUCH_LIFT = clamp(cell * 1.4, 56, 64);

  for (let i=0;i<3;i++){
    slots[i] = { x: boardX + boardW*(i+0.5)/3, y: trayTop + trayH*0.5 };
  }

  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ---------------- sound ---------------- */
const Sound = (function(){
  let ac=null, out=null, muted = !!LS.get('nbr_muted', false);
  const VOL = 0.45;
  const SCALE = [261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];

  function init(){
    if (ac){ if (ac.state === 'suspended') ac.resume().catch(function(){}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch(e){ return; }
    out = ac.createGain();
    out.gain.value = muted ? 0 : VOL;
    const comp = ac.createDynamicsCompressor();
    try { comp.threshold.value=-20; comp.knee.value=20; comp.ratio.value=6; } catch(e){}
    out.connect(comp); comp.connect(ac.destination);
  }
  function tone(freq, dur, o){
    if (!ac || muted) return;
    o = o || {};
    const t0 = ac.currentTime + (o.when || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + dur);
    const vol = (o.vol == null ? 0.2 : o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(out);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  return {
    init,
    isMuted(){ return muted; },
    state(){ return ac ? ac.state : 'none'; },
    setMuted(m){
      muted = !!m; LS.set('nbr_muted', muted);
      if (out && ac) out.gain.setTargetAtTime(muted?0:VOL, ac.currentTime, 0.02);
    },
    ui(){ tone(660,0.06,{type:'triangle',vol:0.07}); },
    pick(){ tone(520,0.05,{type:'sine',vol:0.06}); },
    place(){
      tone(196,0.10,{type:'sine',vol:0.16,slide:150});
      tone(784,0.05,{type:'triangle',vol:0.05,when:0.005});
    },
    deny(){ tone(120,0.12,{type:'square',vol:0.07,slide:90}); },
    clear(combo, lines){
      const idx = Math.min(SCALE.length*2-1, Math.max(0, combo-1));
      const f = SCALE[idx % 8] * Math.pow(2, Math.floor(idx/8));
      tone(f, 0.30, {type:'triangle', vol:0.24});
      tone(f*2, 0.16, {type:'sine', vol:0.09, when:0.012});
      tone(f/2, 0.32, {type:'sine', vol:0.15});
      if (lines >= 2){
        for (let i=1;i<=Math.min(lines-1,3);i++){
          tone(SCALE[(idx+i)%8] * Math.pow(2, Math.floor((idx+i)/8)), 0.20,
               {type:'triangle', vol:0.14, when:0.055*i});
        }
      }
    },
    fever(){
      for (let i=0;i<6;i++){
        tone(SCALE[i%8] * Math.pow(2, Math.floor(i/8)) * 2, 0.22,
             {type:'triangle', vol:0.15, when:i*0.055});
      }
      tone(65,0.5,{type:'sine',vol:0.20,slide:50});
    },
    bomb(){
      tone(110,0.34,{type:'sawtooth',vol:0.20,slide:34});
      tone(420,0.18,{type:'square',vol:0.05,slide:70});
      tone(58,0.42,{type:'sine',vol:0.26,slide:38});
    },
    over(){
      const seq=[392.00,349.23,293.66,220.00];
      seq.forEach(function(f,i){ tone(f,0.34,{type:'triangle',vol:0.16,when:i*0.14}); });
      tone(110,0.7,{type:'sine',vol:0.14,when:0.56});
    },
    record(){
      const seq=[523.25,659.25,783.99,1046.50];
      seq.forEach(function(f,i){ tone(f,0.26,{type:'triangle',vol:0.17,when:i*0.09}); });
    }
  };
})();

/* ---------------- pieces ---------------- */
function parseShape(rows){
  const cells = [];
  let w = 0;
  for (let r=0;r<rows.length;r++){
    w = Math.max(w, rows[r].length);
    for (let c=0;c<rows[r].length;c++){
      const ch = rows[r][c];
      if (ch === 'X' || ch === '1' || ch === '#') cells.push([r,c]);
    }
  }
  return { h: rows.length, w: w, cells: cells };
}

const SHAPES = [
  { g:['X'],                        w:1.00 },
  { g:['XX'],                       w:1.70 },
  { g:['XXX'],                      w:1.60 },
  { g:['XXXX'],                     w:1.00 },
  { g:['XXXXX'],                    w:0.42 },
  { g:['X','X'],                    w:1.70 },
  { g:['X','X','X'],                w:1.60 },
  { g:['X','X','X','X'],            w:1.00 },
  { g:['X','X','X','X','X'],        w:0.42 },
  { g:['XX','XX'],                  w:1.90 },
  { g:['XXX','XXX'],                w:0.50 },
  { g:['XX','XX','XX'],             w:0.38 },
  { g:['XXX','XXX','XXX'],          w:0.16 },
  { g:['XX','X.'],                  w:1.85 },
  { g:['XX','.X'],                  w:1.85 },
  { g:['X.','XX'],                  w:1.85 },
  { g:['.X','XX'],                  w:1.85 },
  { g:['X.','X.','XX'],             w:1.10 },
  { g:['.X','.X','XX'],             w:1.10 },
  { g:['XX','X.','X.'],             w:1.10 },
  { g:['XX','.X','.X'],             w:1.10 },
  { g:['XXX','X..'],                w:1.10 },
  { g:['XXX','..X'],                w:1.10 },
  { g:['X..','XXX'],                w:1.10 },
  { g:['..X','XXX'],                w:1.10 },
  { g:['XXX','.X.'],                w:0.80 },
  { g:['.X.','XXX'],                w:0.80 },
  { g:['X.','XX','X.'],             w:0.80 },
  { g:['.X','XX','.X'],             w:0.80 },
  { g:['.XX','XX.'],                w:0.72 },
  { g:['XX.','.XX'],                w:0.72 },
  { g:['X.','XX','.X'],             w:0.72 },
  { g:['.X','XX','X.'],             w:0.72 },
  { g:['.X.','XXX','.X.'],          w:0.34 },
  { g:['XXX','X.X','XXX'],          w:0.22 },
  { g:['.X.','XXX','XXX'],          w:0.26 }
].map(function(o){ const s = parseShape(o.g); s.weight = o.w; return s; });

const SHAPE_TOTAL = SHAPES.reduce(function(a,s){ return a + s.weight; }, 0);
let pieceSeq = 1;
const PALETTE_N = 6;

function pickShape(){
  let r = Math.random() * SHAPE_TOTAL;
  for (let i=0;i<SHAPES.length;i++){
    r -= SHAPES[i].weight;
    if (r <= 0) return SHAPES[i];
  }
  return SHAPES[0];
}
function makePiece(){
  const s = pickShape();
  return {
    id: pieceSeq++,
    cells: s.cells.map(function(c){ return [c[0], c[1]]; }),
    w: s.w, h: s.h,
    color: rint(1, PALETTE_N)
  };
}

/* ---------------- game state ---------------- */
const S = {
  board: new Uint8Array(N*N),
  pieces: [null,null,null],
  score: 0, best: Number(LS.get('nbr_best', 0)) || 0,
  combo: 0, maxCombo: 0,
  gauge: 0, feverTurns: 0, feverJustStarted: false,
  rerolls: 2, bombs: 1, nextReroll: 5000, nextBomb: 8000,
  gameOver: false, stuck: false, bombMode: false,
  recordCelebrated: false, newRecord: false
};

const flashes = [];   // white cell flashes
const pops = [];      // freshly placed cell pop-in
const particles = [];
const texts = [];
let shake = 0;
let dispScore = 0;
let hintOverride = '';
let timeNow = 0;

/* ---------------- palette & sprites ---------------- */
const PAL = [
  null,
  ['#5ef0ff','#0a7cff'],
  ['#ff6ac1','#c4006d'],
  ['#b98cff','#6d1bff'],
  ['#ffe066','#ff9a00'],
  ['#7dff9e','#00b56a'],
  ['#ff9d6e','#ff2f00']
];
const CORE = [null,'#bffaff','#ffd6ec','#e6d4ff','#fff6c9','#d6ffe3','#ffdccb'];

const spriteCache = {};
function particleSprite(colorHex){
  if (spriteCache[colorHex]) return spriteCache[colorHex];
  const s = document.createElement('canvas');
  s.width = s.height = 48;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(24,24,0,24,24,24);
  g.addColorStop(0,   'rgba(255,255,255,0.95)');
  g.addColorStop(0.22, colorHex);
  g.addColorStop(0.62, hexA(colorHex, 0.55));
  g.addColorStop(1,   hexA(colorHex, 0));
  c.fillStyle = g; c.fillRect(0,0,48,48);
  spriteCache[colorHex] = s;
  return s;
}
function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(function(x){return x+x;}).join('') : h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* ---------------- paths ---------------- */
function rr(x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.min(w,h)/2));
  ctx.beginPath();
  if (ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------------- board helpers ---------------- */
function canPlace(board, piece, r, c){
  const cs = piece.cells;
  for (let i=0;i<cs.length;i++){
    const y = r + cs[i][0], x = c + cs[i][1];
    if (y<0 || y>=N || x<0 || x>=N) return false;
    if (board[y*N+x]) return false;
  }
  return true;
}
function hasAnyPlacement(board, piece){
  if (!piece) return false;
  for (let r=0;r<=N-piece.h;r++)
    for (let c=0;c<=N-piece.w;c++)
      if (canPlace(board, piece, r, c)) return true;
  return false;
}
function fullLines(board){
  const rows = [], cols = [];
  for (let r=0;r<N;r++){
    let f = true;
    for (let c=0;c<N;c++) if (!board[r*N+c]) { f=false; break; }
    if (f) rows.push(r);
  }
  for (let c=0;c<N;c++){
    let f = true;
    for (let r=0;r<N;r++) if (!board[r*N+c]) { f=false; break; }
    if (f) cols.push(c);
  }
  return { rows: rows, cols: cols };
}
function previewLines(piece, r, c){
  if (!piece) return { rows: [], cols: [] };
  const sim = new Uint8Array(S.board);
  for (let i=0;i<piece.cells.length;i++){
    const y = r + piece.cells[i][0], x = c + piece.cells[i][1];
    if (y<0 || y>=N || x<0 || x>=N) return { rows: [], cols: [] };
    sim[y*N+x] = piece.color;
  }
  return fullLines(sim);
}

/* ---------------- effects ---------------- */
function burst(cx, cy, colorIdx, count, power){
  const c1 = PAL[colorIdx] ? PAL[colorIdx][0] : '#9fe8ff';
  for (let i=0;i<count;i++){
    const a = rnd(0, Math.PI*2), sp = rnd(0.6, 1) * power;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - rnd(0,power*0.35),
      life: 1, decay: rnd(0.012, 0.026),
      size: rnd(6,16), color: c1, spin: rnd(-0.2,0.2)
    });
  }
  for (let i=0;i<Math.floor(count*0.4);i++){
    const a = rnd(0, Math.PI*2), sp = rnd(1,2.2)*power;
    particles.push({
      x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, decay: rnd(0.02,0.04), size: rnd(3,7), color: '#ffffff', spin: 0
    });
  }
  if (particles.length > 700) particles.splice(0, particles.length-700);
}

function floatText(txt, x, y, o){
  o = o || {};
  const size = o.size || 22;
  if (size >= 24){
    for (let i=0;i<texts.length;i++){
      const t = texts[i];
      if (t.size >= 24){ t.life = Math.min(t.life, 0.42); t.decay = Math.max(t.decay, 0.05); }
    }
  } else {
    for (let i=0;i<texts.length;i++){
      const t = texts[i];
      if (t.size < 24 && Math.abs(t.y - y) < 14 && Math.abs(t.x - x) < 40) t.y -= 10;
    }
  }
  texts.push({
    txt: txt, x: x, y: y,
    vy: o.vy == null ? -0.9 : o.vy,
    life: 1, decay: o.decay || 0.012,
    size: size,
    color: o.color || '#ffffff',
    weight: o.weight || 900,
    glow: o.glow == null ? 18 : o.glow
  });
  if (texts.length > 24) texts.shift();
}

/* ---------------- HUD ---------------- */
const elScore = $('#score'), elBest = $('#best'), elCombo = $('#combo');
const elFever = $('#fever'), elFeverFill = $('#feverFill'), elFeverTxt = $('#feverTxt');
const elHint = $('#hint');
const elReroll = $('#btnReroll'), elBomb = $('#btnBomb');
const elRerollN = $('#rerollN'), elBombN = $('#bombN');
const elOver = $('#over'), elFinal = $('#finalScore'), elOvBest = $('#ovBest'),
      elOvCombo = $('#ovCombo'), elKicker = $('#overKicker'), elOvSub = $('#ovSub');

let comboPopTimer = 0;

function updateHUD(){
  elBest.textContent = Math.round(S.best).toLocaleString();
  elRerollN.textContent = S.rerolls;
  elBombN.textContent = S.bombs;
  elReroll.disabled = (S.rerolls <= 0);
  elBomb.disabled  = (S.bombs  <= 0);

  if (S.combo >= 2){
    elCombo.textContent = S.combo + ' COMBO · x' + (1 + (S.combo-1)*0.5).toFixed(1).replace('.0','');
    elCombo.classList.add('on');
  } else {
    elCombo.classList.remove('on');
  }

  const feverOn = S.feverTurns > 0;
  elFever.classList.toggle('hot', feverOn);
  if (feverOn){
    elFeverFill.style.width = (S.feverTurns/3*100) + '%';
    elFeverTxt.textContent = 'FEVER ×' + S.feverTurns;
  } else {
    elFeverFill.style.width = Math.round(S.gauge*100) + '%';
    elFeverTxt.textContent = S.gauge > 0.75 ? 'FEVER 임박' : 'FEVER';
  }

  if (hintOverride){ elHint.textContent = hintOverride; elHint.classList.add('warn'); }
  else { elHint.textContent = '블록을 끌어 가로·세로 줄을 채워 터뜨리세요!'; elHint.classList.remove('warn'); }

  const needItem = S.stuck && !S.gameOver;
  elReroll.classList.toggle('pulse', needItem && S.rerolls>0);
  elBomb.classList.toggle('pulse', needItem && S.bombs>0);
  elBomb.classList.toggle('on', S.bombMode);
}

function popCombo(){
  elCombo.classList.add('on');
  elCombo.classList.remove('pop');
  void elCombo.offsetWidth;
  elCombo.classList.add('pop');
}

/* ---------------- scoring / turn flow ---------------- */
function checkCharges(){
  let changed = false;
  while (S.score >= S.nextReroll && S.rerolls < 3){
    S.rerolls++; S.nextReroll += 5000; changed = true;
    floatText('리롤 +1', boardX + boardW*0.5, boardY + boardW*0.30, {size:20,color:'#8ef0ff'});
  }
  while (S.score >= S.nextBomb && S.bombs < 2){
    S.bombs++; S.nextBomb += 8000; changed = true;
    floatText('폭탄 +1', boardX + boardW*0.5, boardY + boardW*0.42, {size:20,color:'#ffd166'});
  }
  return changed;
}

function clearLines(){
  const res = fullLines(S.board);
  const lines = res.rows.length + res.cols.length;
  if (!lines) return { lines: 0, gain: 0 };

  const set = new Set();
  res.rows.forEach(function(r){ for (let c=0;c<N;c++) set.add(r*N+c); });
  res.cols.forEach(function(c){ for (let r=0;r<N;r++) set.add(r*N+c); });
  const cellCount = set.size;

  S.combo++;
  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  /* fever gauge fills with clears */
  const feverWas = S.feverTurns > 0;
  if (!feverWas){
    S.gauge = Math.min(1, S.gauge + Math.min(0.55, 0.11*lines + 0.035*S.combo));
    if (S.gauge >= 1){
      S.feverTurns = 3;
      S.feverJustStarted = true;
    }
  }
  const feverMult = (S.feverTurns > 0) ? 2 : 1;

  const base = lines*100 + cellCount*10 + Math.max(0, lines-1)*150;
  const comboMult = Math.min(1 + (S.combo-1)*0.5, 5);
  const gain = Math.round(base * comboMult * feverMult);
  S.score += gain;

  /* effects */
  let sxSum = 0, sySum = 0;
  set.forEach(function(idx){
    const r = Math.floor(idx/N), c = idx%N;
    const px = boardX + c*cell + cell/2, py = boardY + r*cell + cell/2;
    sxSum += px; sySum += py;
    burst(px, py, S.board[idx] || 1, 7, cell*0.16);
    flashes.push({ x: px, y: py, s: cell*1.5, life: 1 });
    S.board[idx] = 0;
  });
  const cxm = sxSum/set.size, cym = sySum/set.size;

  shake = Math.max(shake, 3 + lines*3.2);
  Sound.clear(S.combo, lines);

  if (lines >= 4)      floatText('MEGA CLEAR!!', cxm, cym - cell*0.4, {size:34, color:'#ffd166', glow:26});
  else if (lines === 3) floatText('TRIPLE!',     cxm, cym - cell*0.4, {size:31, color:'#ffb35c', glow:24});
  else if (lines === 2) floatText('DOUBLE!',     cxm, cym - cell*0.4, {size:28, color:'#8ef0ff', glow:22});

  if (S.combo >= 2){
    floatText(S.combo + ' COMBO!', cxm + rnd(-cell*0.4, cell*0.4), cym + cell*0.55 + rnd(-cell*0.2, cell*0.2), {
      size: 20 + Math.min(14, S.combo*2.2),
      color: S.combo >= 6 ? '#ff6ac1' : '#ffe066',
      vy: 0.35, decay: 0.017, glow: 22
    });
    popCombo();
  }
  floatText('+' + gain, cxm, cym + cell*1.25, {size:22, color:'#ffffff', vy:0.55, decay:0.019, glow:14});

  if (S.feverJustStarted){
    Sound.fever();
    shake = Math.max(shake, 16);
    floatText('FEVER MODE!', boardX + boardW*0.5, boardY + boardW*0.45,
              {size:40, color:'#ff6ec7', vy:0.2, decay:0.007, glow:32});
    for (let i=0;i<26;i++){
      burst(rnd(boardX, boardX+boardW), rnd(boardY, boardY+boardW), rint(1,PALETTE_N), 8, cell*0.2);
    }
  }
  if (navigator.vibrate) { try { navigator.vibrate(lines>=2 ? [20,30,24] : 14); } catch(e){} }
  return { lines: lines, gain: gain };
}

function endTurn(){
  if (S.pieces.every(function(p){ return !p; })) newBatch();

  if (S.feverTurns > 0 && !S.feverJustStarted){
    S.feverTurns--;
    if (S.feverTurns === 0){
      S.gauge = 0;
      floatText('FEVER END', boardX + boardW*0.5, boardY + boardW*0.5, {size:22, color:'#9fb4ff', glow:14});
    }
  }
  S.feverJustStarted = false;

  checkCharges();

  /* new record check */
  if (S.score > S.best){
    if (S.best > 0 && !S.recordCelebrated){
      S.recordCelebrated = true;
      Sound.record();
      floatText('NEW RECORD!', boardX + boardW*0.5, boardY + boardW*0.16,
                {size:26, color:'#ffd166', vy:-0.4, decay:0.008, glow:24});
    }
    S.best = S.score;
    LS.set('nbr_best', Math.round(S.best));
  }

  checkDead();
  updateHUD();
}

function checkDead(){
  const alive = S.pieces.some(function(p){ return p && hasAnyPlacement(S.board, p); });
  S.stuck = !alive;
  if (!alive){
    if (S.rerolls <= 0 && S.bombs <= 0){
      gameOverSoon();
    } else {
      hintOverride = '놓을 곳이 없어요! 리롤이나 폭탄을 쓰세요';
    }
  } else {
    hintOverride = '';
  }
}

let overTimer = 0;
function gameOverSoon(){
  hintOverride = '게임 오버';
  if (overTimer) return;
  overTimer = setTimeout(function(){ overTimer = 0; doGameOver(); }, 520);
}

function doGameOver(){
  if (S.gameOver) return;
  S.gameOver = true;
  S.bombMode = false;
  const isRecord = S.score >= S.best && S.score > 0;
  S.newRecord = isRecord;
  Sound.over();
  if (isRecord){
    elKicker.textContent = '🏆 NEW RECORD';
    elKicker.classList.add('gold');
    elOvSub.textContent = '역대 최고 기록을 새로 썼습니다!';
  } else {
    elKicker.textContent = 'GAME OVER';
    elKicker.classList.remove('gold');
    elOvSub.textContent = '한 판 더, 각이 나옵니다.';
  }
  elFinal.textContent = Math.round(S.score).toLocaleString();
  elOvBest.textContent = Math.round(S.best).toLocaleString();
  elOvCombo.textContent = S.maxCombo;
  elOver.hidden = false;
  updateHUD();
}

/* ---------------- piece batch ---------------- */
function newBatch(){
  let batch = [makePiece(), makePiece(), makePiece()];
  const occ = S.board.reduce(function(a,v){ return a + (v?1:0); }, 0);
  if (occ > 26){
    for (let t=0;t<40;t++){
      if (batch.some(function(p){ return hasAnyPlacement(S.board, p); })) break;
      batch = [makePiece(), makePiece(), makePiece()];
    }
  }
  S.pieces = batch;
}

function reroll(){
  if (S.gameOver || S.rerolls <= 0) { Sound.deny(); return; }
  S.rerolls--;
  Sound.ui();
  S.bombMode = false;
  let batch;
  for (let t=0;t<30;t++){
    batch = [makePiece(), makePiece(), makePiece()];
    if (batch.some(function(p){ return hasAnyPlacement(S.board, p); })) break;
  }
  S.pieces = batch;
  const cy = trayTop + trayH*0.5;
  for (let i=0;i<3;i++){
    burst(slots[i].x, cy, rint(1,PALETTE_N), 10, cell*0.12);
  }
  floatText('REROLL!', boardX + boardW*0.5, trayTop - cell*0.2, {size:18, color:'#8ef0ff', vy:0.2, decay:0.02});
  checkDead();
  updateHUD();
}

/* ---------------- placement ---------------- */
function commitPlacement(pi, r, c, silent){
  const piece = S.pieces[pi];
  if (!piece || S.gameOver) return false;
  if (!canPlace(S.board, piece, r, c)) return false;

  S.pieces[pi] = null;
  for (let i=0;i<piece.cells.length;i++){
    const y = r + piece.cells[i][0], x = c + piece.cells[i][1];
    const idx = y*N + x;
    S.board[idx] = piece.color;
    pops.push({ idx: idx, life: 1 });
  }
  S.score += piece.cells.length * 2;

  if (!silent){
    Sound.place();
    for (let i=0;i<piece.cells.length;i+=2){
      const y = r + piece.cells[i][0], x = c + piece.cells[i][1];
      burst(boardX + x*cell + cell/2, boardY + y*cell + cell/2, piece.color, 2, cell*0.07);
    }
  }

  clearLines();
  endTurn();
  return true;
}

function useBomb(r, c){
  if (S.bombs <= 0 || S.gameOver) return;
  S.bombs--;
  S.bombMode = false;
  Sound.bomb();
  shake = Math.max(shake, 15);
  let hits = 0;
  for (let dr=-1; dr<=1; dr++){
    for (let dc=-1; dc<=1; dc++){
      const y = r+dr, x = c+dc;
      if (y<0||y>=N||x<0||x>=N) continue;
      const idx = y*N+x;
      const px = boardX + x*cell + cell/2, py = boardY + y*cell + cell/2;
      if (S.board[idx]){
        burst(px, py, S.board[idx], 5, cell*0.14);
        S.board[idx] = 0;
        hits++;
      }
      flashes.push({ x: px, y: py, s: cell*2.2, life: 1 });
    }
  }
  floatText('BOOM!', boardX + c*cell + cell/2, boardY + r*cell + cell/2, {size:30, color:'#ffb35c', glow:24});
  if (navigator.vibrate) { try { navigator.vibrate([30,20,40]); } catch(e){} }
  if (S.board.reduce(function(a,v){ return a+(v?1:0); },0) === 0 && hits > 0){
    /* board swept clean: tiny bonus */
    S.score += 120;
    floatText('CLEAN SWEEP +120', boardX+boardW*0.5, boardY+boardW*0.5, {size:20,color:'#8ef0ff'});
  }
  clearLines();
  endTurn();
  updateHUD();
}

/* ---------------- drag input ---------------- */
const drag = {
  active:false, pi:-1, pid:null,
  x:0, y:0, offX:0, offY:0,
  target:null, touch:false
};

function ptOf(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function hitTrayPiece(x, y){
  const pad = cell*0.16;
  for (let i=0;i<3;i++){
    const p = S.pieces[i];
    if (!p) continue;
    const w = p.w*trayCell, h = p.h*trayCell;
    const cx = slots[i].x, cy = slots[i].y;
    if (x >= cx-w/2-pad && x <= cx+w/2+pad && y >= cy-h/2-pad && y <= cy+h/2+pad) return i;
  }
  return -1;
}

function computeTarget(){
  const p = S.pieces[drag.pi];
  if (!p) return null;
  const pcW = p.w*cell, pcH = p.h*cell;
  const cx = drag.x + drag.offX, cy = drag.y + drag.offY;
  const left = cx - pcW/2, top = cy - pcH/2;
  let col = Math.round((left - boardX)/cell);
  let row = Math.round((top - boardY)/cell);
  col = clamp(col, 0, N-p.w);
  row = clamp(row, 0, N-p.h);

  const nearBoard =
    cx > boardX - cell*1.2 && cx < boardX + boardW + cell*1.2 &&
    cy > boardY - cell*1.6 && cy < boardY + boardW + cell*1.2;

  const ok = nearBoard && canPlace(S.board, p, row, col);
  let hint = { rows: [], cols: [] };
  if (ok) hint = previewLines(p, row, col);
  return { row: row, col: col, ok: ok && nearBoard, near: nearBoard, hint: hint };
}

cv.addEventListener('pointerdown', function(e){
  Sound.init();
  if (S.gameOver) return;
  const p = ptOf(e);

  if (S.bombMode){
    const c = Math.floor((p.x - boardX)/cell), r = Math.floor((p.y - boardY)/cell);
    if (r>=0 && r<N && c>=0 && c<N) { useBomb(r,c); }
    else { S.bombMode = false; Sound.ui(); updateHUD(); }
    return;
  }

  if (drag.active) return;
  const pi = hitTrayPiece(p.x, p.y);
  if (pi < 0) return;

  drag.active = true;
  drag.pi = pi;
  drag.pid = e.pointerId;
  drag.touch = (e.pointerType === 'touch');
  drag.x = p.x; drag.y = p.y;

  const piece = S.pieces[pi];
  const cx0 = slots[pi].x, cy0 = slots[pi].y;
  if (drag.touch){
    drag.offX = 0;
    drag.offY = -TOUCH_LIFT;
  } else {
    drag.offX = clamp(cx0 - p.x, -cell*0.9, cell*0.9);
    drag.offY = clamp(cy0 - p.y, -cell*0.9, cell*0.9);
  }
  drag.target = computeTarget();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  Sound.pick();
  e.preventDefault();
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  if (S.bombMode && e.pointerType !== 'touch'){
    const p = ptOf(e);
    bombHover = {
      c: Math.floor((p.x - boardX)/cell),
      r: Math.floor((p.y - boardY)/cell),
      on: true
    };
  }
  if (!drag.active || e.pointerId !== drag.pid) return;
  const p = ptOf(e);
  drag.x = p.x; drag.y = p.y;
  drag.target = computeTarget();
  e.preventDefault();
}, {passive:false});

function endDrag(cancel){
  if	(!drag.active) return;
  const t = drag.target;
  const pi = drag.pi;
  drag.active = false; drag.pi = -1; drag.pid = null; drag.target = null;
  if (cancel) return;
  if (t && t.ok && pi >= 0){
    commitPlacement(pi, t.row, t.col, false);
    updateHUD();
  } else if (t && t.near){
    Sound.deny();
    shake = Math.max(shake, 2.2);
  }
}

cv.addEventListener('pointerup', function(e){
  if (drag.active && e.pointerId !== drag.pid) return;
  endDrag(false);
  e.preventDefault();
}, {passive:false});

cv.addEventListener('pointercancel', function(e){
  if (drag.active && e.pointerId !== drag.pid) return;
  endDrag(true);
});

cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

let bombHover = { r:-1, c:-1, on:false };

/* ---------------- buttons ---------------- */
const btnSound = $('#btnSound');
function syncSoundBtn(){
  const m = Sound.isMuted();
  btnSound.classList.toggle('off', m);
  btnSound.setAttribute('aria-pressed', m ? 'true' : 'false');
  btnSound.setAttribute('aria-label', m ? '소리 켜기' : '소리 끄기');
}
syncSoundBtn();
btnSound.addEventListener('click', function(){
  Sound.init();
  const next = !Sound.isMuted();
  Sound.setMuted(next);
  syncSoundBtn();
  if (!next) Sound.ui();
});

let restartArmed = 0;
const btnRestart = $('#btnRestart');
btnRestart.addEventListener('click', function(){
  Sound.init();
  if (S.score > 0 && !S.gameOver){
    if (Date.now() < restartArmed){
      resetGame();
      restartArmed = 0;
      btnRestart.classList.remove('armed');
    } else {
      restartArmed = Date.now() + 2600;
      btnRestart.classList.add('armed');
      floatText('한 번 더 누르면 새 게임', boardX+boardW*0.5, boardY+boardW*0.5,
                {size:15, color:'#ffd166', vy:0.1, decay:0.012, glow:10});
    }
    return;
  }
  resetGame();
  btnRestart.classList.remove('armed');
});

elReroll.addEventListener('click', function(){
  Sound.init();
  reroll();
});

elBomb.addEventListener('click', function(){
  Sound.init();
  if (S.gameOver) return;
  if (S.bombs <= 0){ Sound.deny(); return; }
  S.bombMode = !S.bombMode;
  Sound.ui();
  updateHUD();
});

$('#btnAgain').addEventListener('click', function(){
  Sound.init();
  resetGame();
});

/* ---------------- reset ---------------- */
function resetGame(){
  S.board.fill(0);
  S.score = 0; dispScore = 0;
  S.combo = 0; S.maxCombo = 0;
  S.gauge = 0; S.feverTurns = 0; S.feverJustStarted = false;
  S.rerolls = 2; S.bombs = 1; S.nextReroll = 5000; S.nextBomb = 8000;
  S.gameOver = false; S.stuck = false; S.bombMode = false;
  S.recordCelebrated = false; S.newRecord = false;
  drag.active = false;
  particles.length = 0; texts.length = 0; flashes.length = 0; pops.length = 0;
  shake = 0; hintOverride = '';
  btnRestart.classList.remove('armed');
  restartArmed = 0;
  S.pieces = [null,null,null];
  newBatch();
  elOver.hidden = true;
  checkDead();
  updateHUD();
}

/* ---------------- drawing ---------------- */
function drawCell(x, y, s, colorIdx, alpha, glow){
  alpha = alpha == null ? 1 : alpha;
  glow = glow == null ? 1 : glow;
  const p = PAL[colorIdx] || PAL[1];
  const pad = Math.max(1.5, s*0.055);
  const r = Math.max(3, s*0.24);

  if (glow > 0){
    ctx.globalAlpha = alpha * 0.20 * glow;
    ctx.fillStyle = p[0];
    rr(x+pad-s*0.10, y+pad-s*0.10, s-pad*2+s*0.20, s-pad*2+s*0.20, r+s*0.08);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.26 * glow;
    rr(x+pad-s*0.04, y+pad-s*0.04, s-pad*2+s*0.08, s-pad*2+s*0.08, r+s*0.04);
    ctx.fill();
  }

  const g = ctx.createLinearGradient(x, y, x+s, y+s);
  g.addColorStop(0, p[0]);
  g.addColorStop(1, p[1]);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  rr(x+pad, y+pad, s-pad*2, s-pad*2, r);
  ctx.fill();

  /* top light */
  ctx.globalAlpha = alpha*0.55;
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  rr(x+pad+s*0.14, y+pad+s*0.13, (s-pad*2)*0.62, (s-pad*2)*0.20, r*0.5);
  ctx.fill();

  /* inner rim */
  ctx.globalAlpha = alpha*0.5;
  ctx.strokeStyle = hexA(CORE[colorIdx] || '#ffffff', 0.5);
  ctx.lineWidth = Math.max(1, s*0.03);
  rr(x+pad, y+pad, s-pad*2, s-pad*2, r);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function drawBoard(){
  const feverOn = S.feverTurns > 0;
  const t = timeNow*0.001;

  /* backdrop */
  rr(boardX-6, boardY-6, boardW+12, boardW+12, 18);
  ctx.fillStyle = 'rgba(7,10,24,0.86)';
  ctx.fill();

  /* frame */
  const pulse = feverOn ? 0.55 + 0.35*Math.sin(t*7) : 0.30;
  ctx.lineWidth = feverOn ? 2.2 : 1.4;
  ctx.strokeStyle = feverOn ? 'rgba(255,90,190,'+pulse+')' : 'rgba(90,150,255,0.30)';
  ctx.stroke();

  if (feverOn){
    const g = ctx.createRadialGradient(boardX+boardW/2, boardY+boardW/2, boardW*0.2,
                                       boardX+boardW/2, boardY+boardW/2, boardW*0.75);
    g.addColorStop(0, 'rgba(255,70,170,0)');
    g.addColorStop(1, 'rgba(255,70,170,'+(0.14+0.06*Math.sin(t*7))+')');
    ctx.fillStyle = g;
    rr(boardX-6, boardY-6, boardW+12, boardW+12, 18);
    ctx.fill();
  }

  /* cells */
  const g2 = Math.max(1.2, cell*0.05);
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      const x = boardX + c*cell, y = boardY + r*cell;
      const v = S.board[r*N+c];
      if (v){
        drawCell(x+g2*0.6, y+g2*0.6, cell-g2*1.2, v, 1, feverOn ? 1.25 : 1);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.032)';
        rr(x+g2, y+g2, cell-g2*2, cell-g2*2, cell*0.22);
        ctx.fill();
        ctx.strokeStyle = 'rgba(140,180,255,0.055)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  /* clear hints while dragging */
  if (drag.active && drag.target && drag.target.ok && drag.target.hint){
    const hint = drag.target.hint;
    const hp = 0.5 + 0.5*Math.sin(t*9);
    ctx.save();
    hint.rows.forEach(function(r){
      ctx.globalAlpha = 0.10 + 0.14*hp;
      ctx.fillStyle = '#ffffff';
      rr(boardX+1, boardY + r*cell + 1, boardW-2, cell-2, cell*0.16);
      ctx.fill();
      ctx.globalAlpha = 0.55 + 0.4*hp;
      ctx.strokeStyle = 'rgba(120,255,255,0.95)';
      ctx.lineWidth = 2;
      rr(boardX+1, boardY + r*cell + 1, boardW-2, cell-2, cell*0.16);
      ctx.stroke();
    });
    hint.cols.forEach(function(c){
      ctx.globalAlpha = 0.10 + 0.14*hp;
      ctx.fillStyle = '#ffffff';
      rr(boardX + c*cell + 1, boardY+1, cell-2, boardW-2, cell*0.16);
      ctx.fill();
      ctx.globalAlpha = 0.55 + 0.4*hp;
      ctx.strokeStyle = 'rgba(255,120,220,0.95)';
      ctx.lineWidth = 2;
      rr(boardX + c*cell + 1, boardY+1, cell-2, boardW-2, cell*0.16);
      ctx.stroke();
    });
    ctx.restore();
  }

  /* bomb targeting */
  if (S.bombMode && bombHover.on && bombHover.r>=0 && bombHover.r<N && bombHover.c>=0 && bombHover.c<N){
    ctx.save();
    ctx.globalAlpha = 0.20 + 0.12*Math.sin(t*8);
    ctx.fillStyle = '#ffb35c';
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const r=bombHover.r+dr, c=bombHover.c+dc;
      if (r<0||r>=N||c<0||c>=N) continue;
      rr(boardX+c*cell+2, boardY+r*cell+2, cell-4, cell-4, cell*0.2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,180,80,0.9)';
    ctx.lineWidth = 2;
    rr(boardX+(bombHover.c-1)*cell+2, boardY+(bombHover.r-1)*cell+2, cell*3-4, cell*3-4, cell*0.2);
    ctx.stroke();
    ctx.restore();
  }

  /* flashes */
  for (let i=flashes.length-1;i>=0;i--){
    const f = flashes[i];
    f.life -= 0.09;
    if (f.life <= 0){ flashes.splice(i,1); continue; }
    const s = f.s*(1.4 - f.life*0.5);
    ctx.globalAlpha = f.life*0.55;
    ctx.fillStyle = '#ffffff';
    rr(f.x - s/2, f.y - s/2, s, s, s*0.35);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* placed pop-in */
  for (let i=pops.length-1;i>=0;i--){
    const p = pops[i];
    p.life -= 0.085;
    if (p.life <= 0){ pops.splice(i,1); continue; }
    if (!S.board[p.idx]) continue;
    const r = Math.floor(p.idx/N), c = p.idx%N;
    const grow = 1 + p.life*0.30;
    const s = cell*grow;
    const x = boardX + c*cell + cell/2, y = boardY + r*cell + cell/2;
    ctx.globalAlpha = Math.min(1, p.life*1.4)*0.55;
    ctx.fillStyle = '#ffffff';
    rr(x-s/2, y-s/2, s, s, s*0.26);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPieceAt(cx, cy, piece, cs, alpha, glow){
  if (!piece) return;
  const left = cx - piece.w*cs/2, top = cy - piece.h*cs/2;
  ctx.globalAlpha = alpha;
  for (let i=0;i<piece.cells.length;i++){
    const r = piece.cells[i][0], c = piece.cells[i][1];
    drawCell(left + c*cs, top + r*cs, cs, piece.color, alpha, glow);
  }
  ctx.globalAlpha = 1;
}

function drawTray(){
  /* slot wells */
  for (let i=0;i<3;i++){
    const p = S.pieces[i];
    const cx = slots[i].x, cy = slots[i].y;
    if (p && !(drag.active && drag.pi === i)){
      const playable = hasAnyPlacement(S.board, p);
      const a = playable ? 1 : 0.32;
      const bob = Math.sin(timeNow*0.002 + i)*cell*0.012;
      drawPieceAt(cx, cy + bob, p, trayCell, a, playable ? 1 : 0.4);
    } else if (p && drag.active && drag.pi === i){
      /* ghost seat */
      ctx.globalAlpha = 0.18;
      for (let k=0;k<p.cells.length;k++){
        const r = p.cells[k][0], c = p.cells[k][1];
        rr(cx - p.w*trayCell/2 + c*trayCell + 2, cy - p.h*trayCell/2 + r*trayCell + 2,
           trayCell-4, trayCell-4, trayCell*0.22);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
}

function drawDrag(){
  if (!drag.active) return;
  const p = S.pieces[drag.pi];
  if (!p) return;
  const t = drag.target;
  const pcW = p.w*cell, pcH = p.h*cell;
  const cx = drag.x + drag.offX, cy = drag.y + drag.offY;

  if (t && t.near){
    for (let i=0;i<p.cells.length;i++){
      const r = t.row + p.cells[i][0], c = t.col + p.cells[i][1];
      if (r<0||r>=N||c<0||c>=N) continue;
      const x = boardX + c*cell, y = boardY + r*cell;
      if (t.ok){
        drawCell(x, y, cell, p.color, 0.34, 0.3);
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = hexA(CORE[p.color] || '#fff', 0.9);
        ctx.lineWidth = 1.6;
        rr(x+cell*0.08, y+cell*0.08, cell*0.84, cell*0.84, cell*0.2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = 'rgba(255,90,110,0.9)';
        ctx.lineWidth = 2;
        rr(x+cell*0.08, y+cell*0.08, cell*0.84, cell*0.84, cell*0.2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  /* the piece itself follows the finger/mouse */
  const left = cx - pcW/2, top = cy - pcH/2;
  ctx.save();
  ctx.shadowColor = hexA(PAL[p.color][0], 0.85);
  ctx.shadowBlur = cell*0.7;
  for (let i=0;i<p.cells.length;i++){
    drawCell(left + p.cells[i][1]*cell, top + p.cells[i][0]*cell, cell, p.color, 1, 1.3);
  }
  ctx.restore();
}

function drawParticles(dt){
  ctx.globalCompositeOperation = 'lighter';
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt*0.06* (60/60);
    p.y += p.vy*dt*0.06;
    p.vy += 0.055;
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.life -= p.decay;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    const s = p.size*(0.4 + p.life*0.9);
    const sp = particleSprite(p.color);
    ctx.globalAlpha = Math.min(1, p.life*1.2);
    ctx.drawImage(sp, p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i=texts.length-1;i>=0;i--){
    const t = texts[i];
    t.y += t.vy;
    t.life -= t.decay;
    if (t.life <= 0){ texts.splice(i,1); continue; }
    const a = Math.min(1, t.life*1.6);
    const grow = 1 + (1 - Math.min(1, t.life*1.3))*0.14;
    ctx.globalAlpha = a;
    ctx.font = '900 ' + (t.size*grow).toFixed(1) + 'px -apple-system,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = t.glow;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(t.txt, t.x, t.y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = t.color;
    ctx.globalAlpha = a*0.85;
    ctx.fillText(t.txt, t.x, t.y);
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
}

/* ---------------- main loop ---------------- */
let lastT = 0;
function frame(now){
  if (!lastT) lastT = now;
  const dt = Math.min(40, now - lastT);
  lastT = now;
  timeNow = now;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  let sx=0, sy=0;
  if (shake > 0.15){
    sx = (Math.random()-0.5)*shake*2;
    sy = (Math.random()-0.5)*shake*2;
    shake *= 0.86;
  } else shake = 0;

  ctx.save();
  ctx.translate(sx, sy);
  drawBoard();
  drawTray();
  drawDrag();
  drawParticles(dt);
  drawTexts();
  ctx.restore();

  /* score ticker */
  if (dispScore < S.score){
    dispScore = Math.min(S.score, dispScore + Math.max(1, Math.abs(S.score-dispScore)*0.22));
    elScore.textContent = Math.round(dispScore).toLocaleString();
  } else if (dispScore > S.score){
    dispScore = S.score;
    elScore.textContent = Math.round(dispScore).toLocaleString();
  }

  if (restartArmed && Date.now() > restartArmed){
    restartArmed = 0;
    btnRestart.classList.remove('armed');
  }

  requestAnimationFrame(frame);
}

/* ---------------- test/QA state hook (read-only) ---------------- */
window.__NBR = function(){
  return {
    version: '1.0.0',
    score: Math.round(S.score), best: Math.round(S.best),
    combo: S.combo, maxCombo: S.maxCombo,
    gauge: Number(S.gauge.toFixed(3)), feverTurns: S.feverTurns,
    rerolls: S.rerolls, bombs: S.bombs,
    gameOver: S.gameOver, stuck: S.stuck, bombMode: S.bombMode,
    muted: Sound.isMuted(), audio: Sound.state(),
    board: Array.from(S.board),
    pieces: S.pieces.map(function(p){
      return p ? { id:p.id, w:p.w, h:p.h, color:p.color,
                   cells:p.cells.map(function(c){ return [c[0],c[1]]; }) } : null;
    }),
    geo: {
      cell: cell, boardX: boardX, boardY: boardY, boardW: boardW,
      trayTop: trayTop, trayH: trayH, trayCell: trayCell, lift: TOUCH_LIFT,
      W: W, H: H,
      slots: slots.map(function(s){ return {x:s.x,y:s.y}; })
    }
  };
};

/* ---------------- boot ---------------- */
function boot(){
  layout();
  resetGame();
  requestAnimationFrame(frame);
}

if (window.ResizeObserver){
  const ro = new ResizeObserver(function(){ layout(); });
  ro.observe(stage);
}
window.addEventListener('resize', function(){ layout(); });
window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

boot();
})();
</script>
